name: Deploy backend to Fly

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "corpus/**"
      - "data/**"
      - "schema/**"
      - "dev/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Idempotent: create the app on the first deploy, no-op afterwards.
      # Fly requires payment info on the account before an app can exist.
      - name: Ensure the Fly app exists
        run: |
          flyctl status --config backend/fly.toml >/dev/null 2>&1 \
            || flyctl apps create rhln-api --org personal
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Build context is the repo root; fly.toml lives in backend/.
      - name: Deploy
        run: flyctl deploy . --remote-only --config backend/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke-test the deployed health endpoint
        run: |
          set -euo pipefail
          url="https://$(flyctl status --config backend/fly.toml --json | jq -r '.Hostname')/api/health"
          echo "checking $url"
          for i in $(seq 1 10); do
            if curl -fsS "$url" | tee /dev/stderr | grep -q '"status"'; then
              echo "healthy"; exit 0
            fi
            sleep 6
          done
          echo "health check never passed"; exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
