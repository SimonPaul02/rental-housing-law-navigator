name: Deploy frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # Hit the stable production alias rather than the per-deploy URL, and
      # follow redirects: a bare deployment URL 302s to Vercel SSO whenever
      # deployment protection is on, which says nothing about the app.
      - name: Smoke-test the deployment
        run: |
          set -euo pipefail
          url="https://rental-housing-law-navigator.vercel.app"
          for i in $(seq 1 10); do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "$url -> 200"
              # The page is only useful if it can reach the API through the rewrite.
              curl -fsSL --max-time 20 "$url/api/health" | grep -q '"status"'
              echo "api proxy reachable"
              exit 0
            fi
            echo "attempt $i: $code"; sleep 5
          done
          echo "never returned 200"; exit 1
