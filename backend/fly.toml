# Rental Housing Law Navigator - FastAPI backend.
app = "rhln-api"

# London, not Boston: the Supabase project is in eu-west-1 (Ireland), and the
# app makes several DB queries per request while the browser makes one request
# per page. Measured, a transatlantic DB hop is ~75ms per query against ~12ms
# from lhr; that trades one ~80ms user hop for N saved ones. Break-even is
# N ~ 1.1 queries, and every page here is well past that. If the database
# moves to us-east-1, change this back to "bos".
primary_region = "lhr"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL   = "INFO"
  DATA_ROOT   = "/srv/starter-pack"

[http_service]
  internal_port = 8080
  force_https   = true

  # Always-on, deliberately. Two reasons:
  #  1. no cold start in front of a judge;
  #  2. Fly stops machines based on HTTP request concurrency, and a Module A
  #     extraction pass runs for many minutes with no inbound traffic - it
  #     would be stopped mid-run.
  auto_stop_machines   = "off"
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size      = "shared-cpu-1x"
  memory    = "512mb"
  cpu_kind  = "shared"
  cpus      = 1

[checks.health]
  type     = "http"
  port     = 8080
  path     = "/api/health"
  interval = "30s"
  timeout  = "5s"
  grace_period = "10s"
