# Rental Housing Law Navigator - FastAPI backend.
app            = "rhln-api"
primary_region = "bos"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL   = "INFO"
  DATA_ROOT   = "/srv/starter-pack"

[http_service]
  internal_port = 8080
  force_https   = true

  # Always-on, deliberately. Two reasons:
  #  1. no cold start in front of a judge;
  #  2. Fly stops machines based on HTTP request concurrency, and a Module A
  #     extraction pass runs for many minutes with no inbound traffic - it
  #     would be stopped mid-run.
  auto_stop_machines   = "off"
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size      = "shared-cpu-1x"
  memory    = "512mb"
  cpu_kind  = "shared"
  cpus      = 1

[checks.health]
  type     = "http"
  port     = 8080
  path     = "/api/health"
  interval = "30s"
  timeout  = "5s"
  grace_period = "10s"
