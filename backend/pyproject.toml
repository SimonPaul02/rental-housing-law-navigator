[project]
name = "rhln-backend"
version = "0.1.0"
description = "Rental Housing Law Navigator - FastAPI backend (Modules A/B/C)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "anthropic>=0.69",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "jsonschema>=4.23",
    "pypdf>=5.1",
    # Multipart form parsing, for uploading a tenancy agreement.
    "python-multipart>=0.0.20",
    # Verifying WorkOS access tokens: RS256 means the crypto extra.
    "pyjwt[crypto]>=2.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["ruff>=0.7", "pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query()/Path()/... in argument defaults IS the FastAPI idiom;
# B008 is wrong about it here.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
